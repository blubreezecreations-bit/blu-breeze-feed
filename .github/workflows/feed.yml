name: Build Pinterest feed
on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["README.md"]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/build_feed.py public/feed.xml
      - run: printf '<!doctype html><title>Blu Breeze feed</title><p><a href="feed.xml">feed.xml</a></p>' > public/index.html
      - name: Publish music library (royalty-free tracks for Reels)
        run: if [ -d music ]; then cp -r music public/music; ls public/music; fi
      - name: Publish post media (Reels/images for Buffer)
        run: if [ -d media ]; then cp -r media public/media; ls -R public/media; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
